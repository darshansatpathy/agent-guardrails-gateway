[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agent-guardrails-gateway"
version = "0.1.0"
description = "A policy enforcement point between AI agents and the tools they call: least privilege, expiring grants, human approval, taint tracking and a tamper-evident audit trail."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Darshan Kumar Satpathy" }]
keywords = ["ai-agents", "guardrails", "mcp", "llm-security", "audit", "governance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["httpx>=0.27"]
otel = ["opentelemetry-api>=1.24"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
  "pip-audit>=2.7",
]

[project.scripts]
aggw = "guardrails_gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/guardrails_gateway"]

[tool.hatch.build.targets.wheel.force-include]
"policies" = "guardrails_gateway/policies"
"evals" = "guardrails_gateway/evals"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "error::ResourceWarning",
  "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["guardrails_gateway"]
