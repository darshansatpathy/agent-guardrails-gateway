# Run the gateway with persistent approvals and audit log:
#   cp .env.example .env   # then set real secrets
#   docker compose up --build
services:
  gateway:
    build: .
    image: agent-guardrails-gateway:local
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      AGGW_DATA_DIR: /data
    volumes:
      - aggw-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    restart: unless-stopped

volumes:
  aggw-data:
